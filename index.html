    <title>การ์ดประวัติส่วนตัวนักเรียน - เด็กชายไตรปิฏก แก้วดอกรัก</title>
    <style>
        /* Base Reset & Setup */
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333333;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Page Layout & Printing Setup */
        @page {
            size: A4;
            margin: 15mm 12mm;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }

        /* Header Accent Banner */
        .header-banner {
            background: linear-gradient(135deg, #0288d1 0%, #005691 100%);
            color: #ffffff;
            padding: 25px 40px;
            position: relative;
        }

        /* ใช้โครงสร้างตารางเพื่อจัดตำแหน่งรูปให้อยู่ข้างข้อความในส่วนหัว */
        .header-table {
            width: 100%;
            border-collapse: collapse;
        }

        .header-table td {
            vertical-align: middle;
            padding: 0;
        }

        .header-image-cell {
            width: 90px;
            text-align: left;
        }

        /* ปรับแต่งรูปภาพให้เป็นทรงกลม มีขอบสีขาวโปร่งแสง */
        .header-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.6);
            object-fit: cover;
            background-color: #ffffff;
        }

        .header-text-cell {
            text-align: left;
            padding-left: 20px;
        }

        .header-banner h1 {
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-banner p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
            font-weight: 400;
        }

        /* Card Content Grid via Tables for WeasyPrint compatibility */
        .content-body {
            padding: 35px 40px;
        }

        .layout-table {
            width: 100%;
            border-collapse: collapse;
        }

        .layout-table td {
            vertical-align: top;
            padding: 0;
        }

        .left-column {
            width: 35%;
            padding-right: 30px;
            border-right: 1px dashed #cfd8dc;
        }

        .right-column {
            width: 65%;
            padding-left: 30px;
        }

        /* Component Styles */
        .profile-avatar-box {
            text-align: center;
            margin-bottom: 25px;
            background-color: #f5f9fc;
            padding: 25px 15px;
            border-radius: 12px;
            border: 1px solid #e1f5fe;
        }

        .avatar-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #b3e5fc;
            color: #0288d1;
            font-size: 40px;
            line-height: 110px;
            margin: 0 auto 15px auto;
            font-weight: bold;
            text-shadow: 1px 1px 0px rgba(25,25,25,0.1);
        }
